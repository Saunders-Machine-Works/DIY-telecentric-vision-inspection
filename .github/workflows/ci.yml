name: CI

on:
  push:
    branches: [main]
  pull_request:

# Fork PRs get a read-only token and no secrets under `pull_request`.
# Never switch this to `pull_request_target`.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  # Windows because the app and the pylon bindings target Windows. The Basler
  # pylon SDK isn't installed here: clippy doesn't link so the whole workspace
  # is linted, but only metrology-core's tests run, since the camera and app
  # test binaries link PylonC_v8_0.lib. Run `cargo test --workspace` locally.
  clippy-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test -p metrology-core

  # Applies .githooks/commit-msg (no AI attribution, GIT-1 in AGENTS.md) to
  # every commit in a PR, since contributors' clones don't run local hooks.
  commit-messages:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Check commit messages
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          status=0
          for sha in $(git rev-list "$BASE..$HEAD"); do
            git log -1 --format=%B "$sha" > "$RUNNER_TEMP/msg"
            if ! sh .githooks/commit-msg "$RUNNER_TEMP/msg"; then
              echo "::error::commit $sha fails the commit-msg check"
              status=1
            fi
          done
          exit $status
